[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skybus-mcp"
version = "0.1.0"
description = "Read-only MCP (Model Context Protocol) server exposing SkyBus crypto intelligence as tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "mcp>=1.0,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Preferred transport: the sibling skybus-client package (top-level ../skybus-client).
# When installed, the server uses it instead of raw httpx calls.
client = ["skybus-client"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
skybus-mcp = "skybus_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skybus_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
